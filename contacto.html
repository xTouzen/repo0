<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
      crossorigin="anonymous"
    />
    <script src="./js/javascript.js" defer></script>
    <title>Nosotros | PStore</title>
  </head>
  <body>
    <nav
      class="navbar navbar-expand-lg text-white p-3"
      style="background-color: #0abab5"
    >
      <div class="container-fluid">
        <a href="./inicio.html">
          <img
            src="./img/logops.png"
            class="img-fluid"
            alt="logops"
            style="max-height: 100px"
        /></a>

        <a class="navbar-brand ms-4" href="./inicio.html" aria-current="page"
          >Pulga Store</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNavDropdown"
          aria-controls="navbarNavDropdown"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavDropdown">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="contacto.html">Contacto</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./nosotros.html">Nosotros</a>
            </li>
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Productos
              </a>
              <ul class="dropdown-menu">
                <li>
                  <a class="dropdown-item" href="./fnuevas.html"
                    >Figuras nuevas</a
                  >
                </li>
                <li>
                  <a class="dropdown-item" href="./fusadas.html"
                    >Figuras usadas</a
                  >
                </li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
      <div
        class="container d-flex flex-column max-auto rounded-4 w-25"
        style="background-color: #0abab5"
      >
        <p id="horaH" class="fs-1 fw-bold text-center lh-1 mb-1"></p>
        <p id="fechaH" class="fs-5 text-center lh-1 mb-1"></p>
        <p id="mesAnio" class="fs-5 text-center lh-1 mb-1"></p>
      </div>
    </nav>
    </nav>

    <div id="alertContainer" class="container mt-3 w-25"></div>

    <main class="container mt-5">
      <div
        style="background-color: #56dfcf"
        class="col-md-6 mx-auto rounded-4 p-4"
      >
        <p class="fs-1 text-center fw-bold">Contáctanos!</p>

        <div class="mb-3">
          <label for="exampleFormControlInput1" class="form-label"
            >Nombre:</label
          >
          <input
            type="text"
            class="form-control"
            id="nombreForm"
            placeholder="nombre"
          />
        </div>
        <div class="mb-3">
          <label for="exampleFormControlInput1" class="form-label"
            >Dirección de correo:</label
          >
          <input
            type="email"
            class="form-control"
            id="emailForm"
            placeholder="name@example.com"
          />
        </div>
        <div class="mb-3">
          <label for="exampleFormControlTextarea1" class="form-label"
            >Mensaje:</label
          >
          <textarea
            class="form-control"
            id="mensajeForm"
            rows="3"
          ></textarea>
        </div>
        <div class="text-center d-grid gap-2 col-6 mx-auto">
          <button onclick="validarFormulario()" type="button" class="btn btn-info btn-lg">Enviar</button>
        </div>
      </div>
    </main>

    <div class="w-100 my-5"></div>

    <footer
      class="footer text-white text-center py-3"
      style="background-color: #135d66"
    >
      <p class="mb-0">&copy; 2025 Pulga Store</p>
      <p class="text-white">
        <a href="preguntasFrecuentes.html" class="text-white text-decoration-none">Preguntas frecuentes</a>
      </p>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
